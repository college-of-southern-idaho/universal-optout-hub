# nginx reverse proxy / TLS terminator for the Universal Opt-Out Hub.
#
# Mirrors the edge-hardening in DEPLOYMENT.md:
#   - terminates TLS and forwards the real client info (so the app's TRUST_PROXY
#     makes req.ip / req.secure correct for logs, the login throttle, and HSTS);
#   - redirects plain HTTP → HTTPS (308), keeping ACME challenges reachable;
#   - blocks /metrics from the outside (scrape it in-network at app:3000/metrics);
#   - refuses dotfile / secret-scanner probes (/.env, /.git, …).
# The app still sends its own security headers (CSP, HSTS, nosniff, X-Frame-Options)
# and fails closed — this layer is defense in depth, not the only line.

# ---- HTTP → HTTPS ------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Keep Let's Encrypt / ACME HTTP-01 challenges working.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 308 https://$host$request_uri; }
}

# ---- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;               # don't advertise the nginx version
    client_max_body_size 5m;         # branding uploads + webhook bodies

    # /metrics is internal-only. Scrape it from inside the network at
    # app:3000/metrics; the app additionally token-guards it via METRICS_TOKEN.
    location = /metrics { deny all; return 404; }

    # Dotfile / secret-probe block (except ACME).
    location ~ /\.(?!well-known) { deny all; return 404; }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # TLS is terminated here
        proxy_read_timeout 90s;
    }
}
